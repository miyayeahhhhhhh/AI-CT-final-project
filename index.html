<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020617;
  --cyan:#22d3ee;
  --purple:#a855f7;
  --pink:#ec4899;
  --text1:#f1f5f9;
  --text2:#94a3b8;
  --text3:#475569;
  --border:rgba(148,163,184,0.08);
  --surface:rgba(15,23,42,0.75);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text1);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:99px}

/* Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;top:-150px;left:-100px;background:radial-gradient(circle,rgba(34,211,238,0.10) 0%,transparent 70%);animation:float1 14s ease-in-out infinite}
.orb2{width:450px;height:450px;top:35%;right:-80px;background:radial-gradient(circle,rgba(168,85,247,0.12) 0%,transparent 70%);animation:float2 12s ease-in-out infinite}
.orb3{width:350px;height:350px;bottom:-50px;left:38%;background:radial-gradient(circle,rgba(236,72,153,0.07) 0%,transparent 70%);animation:float1 16s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,20px)}}

/* Glass */
.glass{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:1.25rem}
.glass-card{background:rgba(15,23,42,0.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(148,163,184,0.08);border-radius:1.25rem;transition:border-color .3s,box-shadow .3s,transform .25s}
.glass-card:hover{border-color:rgba(34,211,238,0.22);box-shadow:0 0 30px rgba(34,211,238,0.07),0 20px 40px rgba(0,0,0,.45);transform:translateY(-2px)}

/* Gradients */
.grad-text{background:linear-gradient(135deg,var(--cyan),var(--purple) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grad-text-sub{background:linear-gradient(120deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* Button */
.btn-grad{position:relative;background:linear-gradient(135deg,var(--cyan),var(--purple));border:none;border-radius:.75rem;color:#fff;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .25s;overflow:hidden}
.btn-grad:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 28px rgba(34,211,238,.3)}
.btn-grad:active:not(:disabled){transform:translateY(0)}
.btn-grad:disabled{opacity:.45;cursor:not-allowed}

/* Search */
.searchbar{background:rgba(15,23,42,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(148,163,184,0.12);border-radius:1rem;transition:border-color .3s,box-shadow .3s}
.searchbar:focus-within{border-color:rgba(34,211,238,.42);box-shadow:0 0 0 3px rgba(34,211,238,.08),0 20px 60px rgba(0,0,0,.5)}
.searchbar input{background:transparent;border:none;outline:none;color:var(--text1);font-family:'DM Sans',sans-serif;font-size:1rem;width:100%}
.searchbar input::placeholder{color:var(--text3)}

/* Pace toggle */
.pace-wrap{background:rgba(15,23,42,.85);border:1px solid var(--border);border-radius:99px;padding:4px;display:inline-flex;backdrop-filter:blur(12px)}
.pace-btn{position:relative;padding:5px 18px;border-radius:99px;border:none;background:transparent;color:var(--text2);font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.03em;cursor:pointer;transition:color .2s;z-index:1;white-space:nowrap}
.pace-btn.active{color:#fff}
.pace-pill{position:absolute;inset:0;background:linear-gradient(135deg,var(--cyan),var(--purple));border-radius:99px;z-index:0;transition:all .3s cubic-bezier(.34,1.56,.64,1)}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.b-cyan{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);color:var(--cyan)}
.b-purple{background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.25);color:var(--purple)}
.b-pink{background:rgba(236,72,153,.1);border:1px solid rgba(236,72,153,.25);color:var(--pink)}

/* Topic chip */
.chip{display:inline-flex;align-items:center;padding:5px 13px;background:rgba(30,41,59,.65);border:1px solid rgba(148,163,184,.1);border-radius:99px;color:var(--text2);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:rgba(34,211,238,.35);color:var(--cyan);background:rgba(34,211,238,.05)}

/* Content blocks */
.cb{padding:1.1rem 1.35rem;border-left:2px solid rgba(34,211,238,.45);background:rgba(34,211,238,.03);border-radius:0 .75rem .75rem 0;margin:.6rem 0}
.cb.purple{border-left-color:rgba(168,85,247,.45);background:rgba(168,85,247,.03)}
.cb.pink{border-left-color:rgba(236,72,153,.45);background:rgba(236,72,153,.03)}

/* Bullet */
.bullet-row{display:flex;align-items:flex-start;gap:.7rem;padding:.55rem 0;border-bottom:1px solid rgba(148,163,184,.06);font-size:.88rem;color:var(--text2);line-height:1.5}
.bullet-row:last-child{border-bottom:none}
.bullet-dot{flex-shrink:0;width:6px;height:6px;margin-top:7px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple))}

/* 3-D flashcard */
.fc-scene{perspective:1000px;width:100%;height:215px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-scene:hover .fc-inner:not(.flipped){transform:rotateY(8deg) scale(1.02)}
.fc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem;text-align:center}
.fc-front{background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.1);backdrop-filter:blur(16px)}
.fc-back{background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(168,85,247,.12));border:1px solid rgba(34,211,238,.22);backdrop-filter:blur(16px);transform:rotateY(180deg)}

/* Tabs */
.tab-bar{display:flex;gap:3px;background:rgba(15,23,42,.65);border:1px solid var(--border);border-radius:.75rem;padding:4px}
.tab-btn{padding:6px 15px;border-radius:.5rem;border:none;background:transparent;color:var(--text2);font-family:'Syne',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab-btn.active{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(168,85,247,.2));color:var(--cyan);border:1px solid rgba(34,211,238,.22)}
.tab-btn:not(.active):hover{color:var(--text1);background:rgba(255,255,255,.04)}

/* Skeleton */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{background:linear-gradient(90deg,rgba(30,41,59,.5) 25%,rgba(51,65,85,.4) 50%,rgba(30,41,59,.5) 75%);background-size:600px 100%;animation:shimmer 1.8s infinite;border-radius:.5rem}

/* Quiz */
.quiz-opt{padding:.7rem 1rem;border:1px solid rgba(148,163,184,.12);border-radius:.75rem;background:rgba(15,23,42,.65);color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s;text-align:left;width:100%;font-family:'DM Sans',sans-serif}
.quiz-opt:hover:not(:disabled){border-color:rgba(34,211,238,.3);color:var(--text1)}
.quiz-opt.correct{border-color:rgba(34,211,238,.6)!important;background:rgba(34,211,238,.1)!important;color:var(--cyan)!important}
.quiz-opt.wrong{border-color:rgba(236,72,153,.6)!important;background:rgba(236,72,153,.08)!important;color:var(--pink)!important}

/* Summary box */
.sumbox{background:linear-gradient(135deg,rgba(34,211,238,.06),rgba(168,85,247,.06));border:1px solid rgba(168,85,247,.22);border-radius:1rem;padding:1.2rem}

/* Video placeholder */
.vid-ph{aspect-ratio:16/9;background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.08);border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.65rem;cursor:pointer;transition:border-color .2s}
.vid-ph:hover{border-color:rgba(168,85,247,.3)}
.vid-btn{width:48px;height:48px;background:linear-gradient(135deg,var(--cyan),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s}
.vid-ph:hover .vid-btn{transform:scale(1.1);box-shadow:0 0 22px rgba(168,85,247,.4)}

/* Concept map */
.cmap-wrap{width:100%;height:300px;background:rgba(15,23,42,.55);border:1px solid var(--border);border-radius:1.25rem;overflow:hidden;position:relative}

/* Pulse */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}50%{box-shadow:0 0 0 6px rgba(34,211,238,0)}}
.pulse-dot{display:inline-block;width:7px;height:7px;background:var(--cyan);border-radius:50%;animation:pulse 2s ease-in-out infinite}

/* Glow line */
.glow-h{height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.25),transparent)}

/* Fade up */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .45s ease both}
.fu1{animation:fadeUp .45s .08s ease both}
.fu2{animation:fadeUp .45s .16s ease both}
.fu3{animation:fadeUp .45s .24s ease both}
.fu4{animation:fadeUp .45s .32s ease both}

/* Error */
.err-box{background:rgba(236,72,153,.08);border:1px solid rgba(236,72,153,.25);border-radius:1rem;padding:1rem 1.25rem}

/* Spin */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}

/* Relative + z */
.rz{position:relative;z-index:1}

/* Dense */
.dense{font-size:.88rem;line-height:1.85;color:var(--text2)}
.dense p+p{margin-top:.8rem}
</style>
</head>

// ─── DEMO DATA ────────────────────────────────────────────────────────────────
function buildDemo(topic, pace) {
  const t = topic || "Quantum Computing";
  const bodyMap = {
    deep:   { cb1:`${t} operates on principles fundamentally distinct from classical computation. Qubits leverage superposition to exist as 0 and 1 simultaneously until measured. Combined with entanglement and quantum interference, this enables exponential parallelism impossible in classical systems.`, cb2:`Applications span cryptography (Shor's algorithm), molecular simulation for drug discovery, optimization via quantum annealing, and machine learning acceleration. IBM, Google, and IonQ compete for fault-tolerant milestones.`, cb3:`Decoherence — quantum state loss via environmental interaction — occurs within microseconds at room temperature, necessitating ~15 millikelvin operating conditions. Error correction requires hundreds of physical qubits per logical qubit, making fault-tolerant quantum computing a late-2030s milestone.`, cb4:`Quantum advantage is strictly problem-specific. Grover's algorithm yields only quadratic speedup for unstructured search. Classical computing will dominate most workloads for the foreseeable future.` },
    steady: { cb1:`${t} uses qubits that harness superposition and entanglement, allowing quantum computers to explore many solutions simultaneously — a massive advantage for specific problem classes.`, cb2:`Key applications include breaking RSA encryption (Shor's algorithm), accelerating drug discovery, and solving complex logistics problems. IBM and Google lead hardware research.`, cb3:`Qubits are extremely fragile; environmental noise causes decoherence in microseconds. Operating near absolute zero helps, but error correction remains a major engineering challenge.`, cb4:`Quantum computers won't replace classical ones — they're specialized tools. Quantum advantage exists only for specific algorithmic problems, not everyday computing tasks.` },
    fast:   { cb1:"Qubits use superposition to be 0 and 1 at once — massively parallel processing.", cb2:"Threatens RSA encryption, accelerates drug discovery and optimization tasks.", cb3:"Decoherence is the core problem: qubits collapse at room temperature within microseconds.", cb4:"Not universally faster — only beats classical computing for specific problem types." },
  };
  const b = bodyMap[pace] || bodyMap.steady;
  return {
    title: `${t}: A Complete Adaptive Overview`,
    summary: `${t} represents one of the most transformative paradigm shifts in computation. This adaptive module distills core concepts — from quantum mechanics foundations to real-world applications — tailored to your selected learning pace.`,
    content_blocks: [
      { id:"cb1", type:"concept",  heading:"Foundational Principles",    body:b.cb1, accent:"cyan"   },
      { id:"cb2", type:"example",  heading:"Real-World Applications",    body:b.cb2, accent:"purple" },
      { id:"cb3", type:"insight",  heading:"Core Engineering Challenges", body:b.cb3, accent:"pink"  },
      { id:"cb4", type:"warning",  heading:"Common Misconceptions",      body:b.cb4, accent:"cyan"   },
    ],
    key_points: [
      "Qubits exploit superposition: simultaneously 0 and 1 until measured",
      "Quantum entanglement correlates qubit states across physical distance",
      "Decoherence is the primary engineering barrier today",
      "Quantum speedup is problem-specific — not a universal accelerator",
      "The first fault-tolerant machines may arrive in the mid-to-late 2030s",
    ],
    flashcards: [

Pace="${pace}": ${pace==="deep"?"Use dense academic language, 4-5 sentences per block.":pace==="steady"?"Use clear balanced paragraphs, 2-3 sentences per block.":"Use punchy single sentences per block."}`;

async function fetchContent(topic, pace) {
  if (!CONFIG.GROQ_API_KEY || CONFIG.GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE") {
    await new Promise(r => setTimeout(r, 900)); // simulate latency
    return buildDemo(topic, pace);
  }
  const res = await fetch(CONFIG.URL, {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization":`Bearer ${CONFIG.GROQ_API_KEY}` },
    body: JSON.stringify({
      model: CONFIG.MODEL,
      messages: [{ role:"system", content:SYS(pace) }, { role:"user", content:`Topic: ${topic}` }],
      temperature: 0.7,
      max_tokens: 3000,
    }),
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || `HTTP ${res.status}`); }
  const data = await res.json();
  const raw = data.choices?.[0]?.message?.content || "{}";
  const clean = raw.replace(/```json|```/g,"").trim();
  try { return JSON.parse(clean); }
  catch { const m = clean.match(/\{[\s\S]*\}/); if (m) return JSON.parse(m[0]); throw new Error("Invalid JSON from API"); }
}

// ─── CONCEPT MAP ──────────────────────────────────────────────────────────────
function ConceptMap({ nodes=[], edges=[] }) {
  const [hov, setHov] = useState(null);
  const W=680, H=280;
  const cx = (x) => (x/100)*(W-80)+40;
  const cy = (y) => (y/100)*(H-60)+30;
  const tc  = {core:"#22d3ee", branch:"#a855f7", leaf:"#ec4899"};

  return (
    <div className="cmap-wrap">
      <div style={{position:"absolute",top:10,left:14,display:"flex",alignItems:"center",gap:6,zIndex:2}}>
        <Icon d={Icons.Network} size={12} color="#475569"/>
        <span style={{fontFamily:"'JetBrains Mono'",fontSize:"0.68rem",color:"#475569",letterSpacing:".06em"}}>CONCEPT MAP</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%">
        <defs>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="#22d3ee" stopOpacity="0.28"/>
            <stop offset="100%" stopColor="#22d3ee" stopOpacity="0"/>
          </radialGradient>
        </defs>
        {edges.map((e,i)=>{
          const a=nodes.find(n=>n.id===e.from), b=nodes.find(n=>n.id===e.to);
          if(!a||!b) return null;
          return <line key={i} x1={cx(a.x)} y1={cy(a.y)} x2={cx(b.x)} y2={cy(b.y)}
            stroke="rgba(148,163,184,.15)" strokeWidth={hov===e.from||hov===e.to?1.8:.8}
            strokeDasharray={b.type==="leaf"?"4 4":"none"}/>;
        })}
        {nodes.map(n=>(
          <g key={n.id} onMouseEnter={()=>setHov(n.id)} onMouseLeave={()=>setHov(null)} style={{cursor:"pointer"}}>
            {n.type==="core"&&<circle cx={cx(n.x)} cy={cy(n.y)} r={n.size*2.8} fill="url(#coreGlow)"/>}
            <circle cx={cx(n.x)} cy={cy(n.y)} r={n.size}
              fill={tc[n.type]||"#94a3b8"} fillOpacity={hov===n.id?.32:.14}
              stroke={tc[n.type]||"#94a3b8"} strokeWidth={hov===n.id?2:1}/>
            <text x={cx(n.x)} y={cy(n.y)+n.size+12} textAnchor="middle"
              fill={hov===n.id?"#f1f5f9":"#64748b"}
              fontSize={n.type==="core"?11:9}
              fontFamily="'JetBrains Mono',monospace"
              fontWeight={n.type==="core"?"600":"400"}>
              {n.label}
            </text>
          </g>
        ))}
      </svg>
    </div>
  );
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function Quiz({ quiz=[] }) {
  const [ans, setAns] = useState({});
  const [score, setScore] = useState(null);

  const pick = (qid, idx, correct) => {
    if (ans[qid]!==undefined) return;
    const next = {...ans, [qid]:{idx, ok: idx===correct}};
    setAns(next);
    if (Object.keys(next).length===quiz.length) {
      setTimeout(()=>setScore(Object.values(next).filter(a=>a.ok).length),300);
    }
  };

  if (!quiz.length) return null;
  return (
    <div className="glass-card p-5 space-y-5">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <Icon d={Icons.Flask} size={14} color="#22d3ee"/>
          <span style={{fontFamily:"'Syne'",fontSize:".85rem",fontWeight:700,color:"#f1f5f9"}}>Quick Quiz</span>
        </div>
        {score!==null && <span className="badge b-cyan">{score}/{quiz.length} Correct</span>}
      </div>
      {quiz.map((q,qi)=>(
        <div key={q.id} className="space-y-2">
          <p style={{fontSize:".85rem",fontWeight:500,color:"#cbd5e1"}}>{qi+1}. {q.q}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {q.opts.map((opt,oi)=>{
              const a=ans[q.id];
              let cls="quiz-opt";
              if(a!==undefined){if(oi===q.ans)cls+=" correct";else if(oi===a.idx&&oi!==q.ans)cls+=" wrong";}
              return <button key={oi} className={cls} disabled={a!==undefined} onClick={()=>pick(q.id,oi,q.ans)}>{opt}</button>;
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

  const [pace,    setPace]   = useState("steady");
  const [data,    setData]   = useState(null);
  const [loading, setLoad]   = useState(false);
  const [error,   setError]  = useState(null);
  const topicRef = useRef("Quantum Computing");

  const load = useCallback(async (topic, p) => {
    setLoad(true); setError(null);
    try {
      const result = await fetchContent(topic, p||pace);
      setData(result);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoad(false);
    }
  }, [pace]);

  // Boot with demo
  useEffect(() => { load("Quantum Computing", "steady"); }, []);

  // Re-fetch on pace change if we have a topic
  const paceRef = useRef(pace);
  useEffect(()=>{
    if(paceRef.current!==pace && topicRef.current) {
      paceRef.current=pace;
      load(topicRef.current, pace);
    }
  },[pace]);

  const handleSearch = (topic) => {
    topicRef.current = topic;
    load(topic, pace);
  };

  return (
    <div style={{minHeight:"100vh",background:"#020617",position:"relative"}}>
      {/* Orbs */}
      <div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/>

      <div style={{position:"relative",zIndex:1}}>
        <Header pace={pace} setPace={setPace} show={!!data}/>
        <Hero onSearch={handleSearch} loading={loading}/>

        <div className="glow-h" style={{maxWidth:900,margin:"0 auto 28px",opacity:.4}}/>

        <ErrorBanner msg={error} onDismiss={()=>setError(null)}/>
        <Dashboard data={data} pace={pace} loading={loading}/>
        {data&&!loading&&<FlashcardGrid cards={data.flashcards||[]}/>}

        <footer style={{borderTop:"1px solid rgba(148,163,184,.07)",padding:"20px 24px",marginTop:8}}>
          <div style={{maxWidth:900,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontFamily:"'JetBrains Mono'",fontSize:".7rem",color:"#1e293b"}}>NeuralPath © {new Date().getFullYear()}</span>
            <span style={{fontFamily:"'JetBrains Mono'",fontSize:".7rem",color:"#1e293b",display:"flex",alignItems:"center",gap:6}}>
              <Icon d={Icons.Lock} size={10} color="#1e293b"/>Powered by Groq · llama3-70b-8192
            </span>
          </div>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
